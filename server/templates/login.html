<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyert — Войти</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <meta name="theme-color" content="#2563EB">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            min-height: 100vh;
            background: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1a202c;
            display: flex; align-items: center; justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .12; }
        .b1 { width: 400px; height: 400px; background: #2563EB; top: -100px; right: -100px; }
        .b2 { width: 350px; height: 350px; background: #60A5FA; bottom: -80px; left: -80px; }
        .wrap {
            position: relative; z-index: 1;
            width: 100%; max-width: 420px;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 24px;
            padding: 36px 32px;
            box-shadow: 0 4px 24px rgba(37,99,235,0.06);
        }
        .logo { text-align: center; margin-bottom: 28px; }
        .logo img {
            width: 72px; height: 72px;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(37,99,235,0.18);
        }
        .logo h1 {
            font-size: 26px; font-weight: 800;
            color: #2563EB;
            margin-top: 12px;
        }
        .logo p { color: #64748b; font-size: 14px; margin-top: 2px; }

        .field { margin-bottom: 16px; }
        .field label {
            display: block; font-size: 13px; font-weight: 600;
            color: #475569; margin-bottom: 6px;
        }
        .field-row { position: relative; display: flex; align-items: center; }
        .prefix {
            position: absolute; left: 14px;
            color: #2563EB; font-weight: 700; font-size: 16px;
        }
        .field-row input { padding-left: 32px !important; }
        input {
            width: 100%; padding: 12px 14px;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            color: #1a202c;
            font-size: 15px; outline: none;
            transition: all .2s;
            font-family: inherit;
        }
        input:focus {
            border-color: #2563EB;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37,99,235,0.1);
        }
        input::placeholder { color: #94a3b8; }

        .btn {
            width: 100%; padding: 13px;
            background: #2563EB;
            border: none; border-radius: 12px;
            color: #ffffff; font-size: 15px; font-weight: 600;
            cursor: pointer; margin-top: 8px;
            transition: all .2s;
        }
        .btn:hover { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(37,99,235,0.25); }
        .err { color: #ef4444; font-size: 13px; margin-top: 10px; text-align: center; min-height: 18px; }

        .divider {
            margin: 16px 0; text-align: center; position: relative;
        }
        .divider span {
            background: #fff; padding: 0 12px;
            color: #94a3b8; font-size: 12px; position: relative; z-index: 1;
        }
        .divider::before {
            content: ''; position: absolute;
            top: 50%; left: 0; right: 0; height: 1px;
            background: #e5e7eb;
        }

        .tg-btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 12px; background: #2AABEE;
            border-radius: 12px; color: #fff;
            font-size: 14px; font-weight: 600;
            text-decoration: none; transition: all .2s;
        }
        .tg-btn:hover { background: #229ED9; transform: translateY(-1px); }

        .footer {
            text-align: center; margin-top: 20px;
            padding-top: 16px; border-top: 1px solid #e5e7eb;
            color: #64748b; font-size: 14px;
        }
        .footer a { color: #2563EB; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div>
    <div class="wrap">
        <div class="card">
            <div class="logo">
                <img src="/static/icon-192.png" alt="Gyert">
                <h1>Gyert</h1>
                <p>Войдите в аккаунт</p>
            </div>
            <form id="loginForm">
                <div class="field">
                    <label>Юзернейм или Email</label>
                    <div class="field-row">
                        <span class="prefix">@</span>
                        <input type="text" id="username" placeholder="username или email" autocomplete="username" required>
                    </div>
                </div>
                <div class="field">
                    <label>Пароль</label>
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn">Войти</button>
                <div class="err" id="err"></div>
            </form>
            <div class="divider"><span>или</span></div>
            <a href="/login-tg" class="tg-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.248l-2.012 9.483c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.875.738z"/></svg>
                Войти через Telegram
            </a>
            <div class="footer">
                Нет аккаунта? <a href="/register">Зарегистрироваться</a>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').onsubmit = async e => {
            e.preventDefault();
            const err = document.getElementById('err');
            err.textContent = '';
            try {
                const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({username: document.getElementById('username').value, password: document.getElementById('password').value})});
                const d = await r.json();
                if (d.success) window.location.href = '/feed';
                else err.textContent = d.error || 'Ошибка';
            } catch(x) {
                err.textContent = 'Ошибка соединения';
            }
        };
    </script>
</body>
</html>
