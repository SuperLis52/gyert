<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyert — Регистрация</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <meta name="theme-color" content="#2563EB">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            min-height: 100vh;
            background: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1a202c;
            overflow-y: auto;
            -webkit-font-smoothing: antialiased;
        }
        .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .12; }
        .b1 { width: 400px; height: 400px; background: #2563EB; top: -100px; right: -100px; }
        .b2 { width: 350px; height: 350px; background: #60A5FA; bottom: -80px; left: -80px; }
        .wrap {
            position: relative; z-index: 1;
            max-width: 460px; margin: 0 auto;
            padding: 40px 20px 60px;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 24px;
            padding: 36px 32px;
            box-shadow: 0 4px 24px rgba(37,99,235,0.06);
        }
        .logo { text-align: center; margin-bottom: 28px; }
        .logo img {
            width: 72px; height: 72px;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(37,99,235,0.18);
        }
        .logo h1 {
            font-size: 26px; font-weight: 800;
            color: #2563EB;
            margin-top: 12px;
        }
        .logo p { color: #64748b; font-size: 14px; margin-top: 2px; }

        .field { margin-bottom: 16px; }
        .field label {
            display: block; font-size: 13px; font-weight: 600;
            color: #475569; margin-bottom: 6px;
        }
        .field label small { color: #94a3b8; font-weight: 400; }
        .field-row { position: relative; display: flex; align-items: center; }
        .prefix {
            position: absolute; left: 14px;
            color: #2563EB; font-weight: 700; font-size: 16px;
        }
        .field-row input { padding-left: 32px !important; }
        input, textarea {
            width: 100%; padding: 12px 14px;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            color: #1a202c;
            font-size: 15px; outline: none;
            transition: all .2s;
            font-family: inherit;
        }
        input:focus {
            border-color: #2563EB;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37,99,235,0.1);
        }
        input::placeholder { color: #94a3b8; }

        .ava-preview {
            display: flex; flex-direction: column;
            align-items: center; gap: 4px; margin-bottom: 8px;
        }
        .ava-circle {
            width: 72px; height: 72px; border-radius: 50%;
            background: #f0f4ff;
            border: 3px solid #2563EB;
            display: flex; align-items: center; justify-content: center;
            font-size: 36px;
            box-shadow: 0 0 20px rgba(37,99,235,0.15);
        }
        .ava-label { font-size: 11px; color: #64748b; }
        .emoji-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px; padding: 10px;
        }
        .emoji-grid {
            max-height: 140px; overflow-y: auto;
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
        }
        .ep {
            aspect-ratio: 1; font-size: 24px;
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 10px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all .15s;
        }
        .ep:hover { border-color: #2563EB; background: #f0f4ff; }
        .ep.sel {
            border-color: #2563EB;
            background: #2563EB;
        }
        .hint { text-align: center; font-size: 10px; color: #94a3b8; margin-top: 4px; }

        .pw-bar { height: 3px; border-radius: 2px; margin-top: 5px; transition: all .3s; }
        .pw-w { width: 33%; background: #ef4444; }
        .pw-m { width: 66%; background: #f59e0b; }
        .pw-s { width: 100%; background: #10b981; }

        .btn {
            width: 100%; padding: 13px;
            background: #2563EB;
            border: none; border-radius: 12px;
            color: #ffffff; font-size: 15px; font-weight: 600;
            cursor: pointer; margin-top: 8px;
            transition: all .2s;
        }
        .btn:hover { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(37,99,235,0.25); }
        .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
        .err { color: #ef4444; font-size: 13px; margin-top: 10px; text-align: center; min-height: 18px; }
        .footer {
            text-align: center; margin-top: 20px;
            padding-top: 16px; border-top: 1px solid #e5e7eb;
            color: #64748b; font-size: 14px;
        }
        .footer a { color: #2563EB; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div>
    <div class="wrap">
        <div class="card">
            <div class="logo">
                <img src="/static/icon-192.png" alt="Gyert">
                <h1>Gyert</h1>
                <p>Создайте аккаунт</p>
            </div>
            <form id="f">
                <div class="field">
                    <label>Аватар</label>
                    <div class="ava-preview">
                        <div class="ava-circle" id="prev">😊</div>
                        <span class="ava-label">Нажмите на эмодзи ниже</span>
                    </div>
                    <div class="emoji-box">
                        <div class="emoji-grid" id="grid"></div>
                        <div class="hint">↕ прокрутите</div>
                    </div>
                </div>
                <div class="field">
                    <label>Имя</label>
                    <input type="text" id="dn" placeholder="Как вас зовут?" required>
                </div>
                <div class="field">
                    <label>Email <small>(будет проверен)</small></label>
                    <input type="email" id="email" placeholder="example@mail.com" required>
                </div>
                <div class="field">
                    <label>Юзернейм</label>
                    <div class="field-row">
                        <span class="prefix">@</span>
                        <input type="text" id="un" placeholder="username" required pattern="[a-zA-Z0-9_]{3,}">
                    </div>
                </div>
                <div class="field">
                    <label>Телефон <small>(необязательно)</small></label>
                    <input type="tel" id="ph" placeholder="+7 999 123 45 67">
                </div>
                <div class="field">
                    <label>Пароль</label>
                    <input type="password" id="pw" placeholder="Минимум 6 символов" required minlength="6" oninput="pwStr(this.value)">
                    <div class="pw-bar" id="pwb"></div>
                </div>
                <div class="field">
                    <label>Повторите пароль</label>
                    <input type="password" id="pw2" placeholder="Ещё раз" required>
                </div>
                <button type="submit" class="btn" id="sub">Зарегистрироваться</button>
                <div class="err" id="err"></div>
            </form>
            <div class="footer">Уже есть аккаунт? <a href="/login">Войти</a></div>
        </div>
    </div>
    <script>
        const E=['😀','😁','😂','🤣','😃','😄','😅','😆','😉','😊','😇','🥰','😍','🤩','😘','😋','😛','🤪','🤓','😎','🥳','😤','🤗','🤔','🤫','🤭','😶','😏','😌','😴','🤯','🥺','😈','👻','💀','🤖','👽','🦊','🐱','🐶','🐻','🐼','🐨','🦁','🐯','🐸','🐵','🦋','🐢','🦄','🌸','🌺','🍀','🔥','⚡','🌈','💎','🚀','🎸','🎵'];
        let sel='😊';
        const g=document.getElementById('grid');
        E.forEach(e=>{
            const b=document.createElement('button');
            b.type='button'; b.className='ep'+(e===sel?' sel':''); b.textContent=e;
            b.onclick=()=>{
                sel=e; document.getElementById('prev').textContent=e;
                g.querySelectorAll('.ep').forEach(x=>x.classList.remove('sel'));
                b.classList.add('sel');
            };
            g.appendChild(b);
        });
        function pwStr(v){
            const b=document.getElementById('pwb');
            if(v.length<6) b.className='pw-bar pw-w';
            else if(v.length<10||!/[A-Z]/.test(v)||!/[0-9]/.test(v)) b.className='pw-bar pw-m';
            else b.className='pw-bar pw-s';
        }
        document.getElementById('f').onsubmit=async e=>{
            e.preventDefault();
            const err=document.getElementById('err'); err.textContent='';
            const pw=document.getElementById('pw').value;
            if(pw!==document.getElementById('pw2').value){err.textContent='Пароли не совпадают';return;}
            const sub=document.getElementById('sub'); sub.disabled=true; sub.textContent='...';
            try{
                const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({username:document.getElementById('un').value, display_name:document.getElementById('dn').value,
                        password:pw, phone:document.getElementById('ph').value, email:document.getElementById('email').value, avatar_emoji:sel})});
                const d=await r.json();
                if(d.success) window.location.href=d.verify_required?'/verify-email':'/feed';
                else{err.textContent=d.error||'Ошибка'; sub.disabled=false; sub.textContent='Зарегистрироваться';}
            }catch(x){err.textContent='Ошибка соединения'; sub.disabled=false; sub.textContent='Зарегистрироваться';}
        };
    </script>
</body>
</html>
